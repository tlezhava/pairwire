name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run traceability
      - run: npm run build
      - name: Committed plugin bundle is current
        run: npm run build:plugin && git diff --exit-code -- plugins/
      - name: Validate the marketplace and plugin
        run: |
          npx -y @anthropic-ai/claude-code@2.1.300 plugin validate . --strict
          npx -y @anthropic-ai/claude-code@2.1.300 plugin validate plugins/claude-code --strict

  relay-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the relay-node image
        run: docker build -f packages/relay-node/Dockerfile -t pairwire-relay:ci .
      - name: Smoke-test the image
        run: |
          docker run -d --name relay -p 8787:8787 pairwire-relay:ci
          for i in $(seq 1 20); do curl -fs localhost:8787/health && break; sleep 1; done
          test "$(curl -fs localhost:8787/health)" = ok
          curl -fs localhost:8787/v1/info | grep -q '"protocol":\[1\]'
          test "$(docker exec relay id -un)" = node
          docker rm -f relay
