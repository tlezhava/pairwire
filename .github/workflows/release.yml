# Release (specs/04-client.md section 9, ADR-021). Runs when a v* tag is pushed; the tag comes
# from `npm run release -- <version>`, which never pushes.
#
# Needs no secrets. npm publishes through trusted publishing (OIDC): the pairwire package on
# npmjs.com trusts this workflow (tlezhava/pairwire, release.yml), so no npm token exists
# (ADR-021). The image is pushed with the workflow's own GITHUB_TOKEN. npm provenance requires a
# public repository.
name: Release

on:
  push:
    tags: ["v*"]
  # Re-run the npm publish (and the GitHub release) for a tag that already exists, e.g. after
  # a publish failed; the image is not rebuilt. Trusted publishing checks this same file.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v0.1.1"
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Every version location matches the tag
        id: v
        run: |
          version="${TAG#v}"
          npx tsx scripts/release.ts --check "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"

  npm:
    needs: [ci, version]
    # On a manual re-run the ci job is skipped: it already passed for the tagged commit.
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run pack:npm
      # npm trusted publishing (OIDC): npm trusts this workflow for the pairwire package, so
      # no token is stored anywhere. Needs npm >= 11.5.1 and id-token: write (ADR-021).
      - name: Publish pairwire
        working-directory: build/npm
        env:
          DIST_TAG: ${{ needs.version.outputs.prerelease == 'true' && 'next' || 'latest' }}
        run: npx -y npm@11.21.0 publish --provenance --access public --tag "$DIST_TAG" --loglevel verbose

  image:
    needs: [ci, version]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/tlezhava/pairwire-relay
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease != 'true' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/relay-node/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    needs: [version, npm, image]
    if: ${{ !cancelled() && needs.npm.result == 'success' && (needs.image.result == 'success' || needs.image.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && { echo "release $TAG exists"; exit 0; }
          set -- --verify-tag --generate-notes --title "pairwire $TAG"
          [ "$PRERELEASE" = true ] && set -- "$@" --prerelease --latest=false
          gh release create "$TAG" "$@"
